version: 2.1

orbs:
  node: circleci/node@7.2.1

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          context: cloudflare

jobs:
  build:
    executor:
      name: node/default
      tag: '24.20.0'
    steps:
      - checkout
      - node/install-packages
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - build

  deploy:
    executor:
      name: node/default
      tag: '24.20.0'
    steps:
      - checkout
      - attach_workspace:
          at: ~/project
      - node/install-packages
      - run:
          name: Deploy to Cloudflare Pages
          # Needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Pages: Edit)
          # from the "cloudflare" context configured in the CircleCI UI.
          environment:
            CI: "true"
          command: ./node_modules/.bin/wrangler pages deploy
