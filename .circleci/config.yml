version: 2.1

workflows:
  build-and-deploy:
    jobs:
      - build
      - deploy:
          requires:
            - build
          context: cloudflare

jobs:
  build:
    docker:
      - image: cimg/node:24.20
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Build
          command: npm run build
      - persist_to_workspace:
          root: .
          paths:
            - build

  deploy:
    docker:
      - image: cimg/node:24.20
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Install dependencies
          command: npm ci
      - run:
          name: Deploy to Cloudflare Pages
          # Needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN (Pages: Edit)
          # from the "cloudflare" context configured in the CircleCI UI.
          command: ./node_modules/.bin/wrangler pages deploy build
